<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Earth Information Jukebox</title><style>body{margin:0;font-family:Arial,sans-serif;background:#061b2b;color:#fff;text-align:center}header{padding:30px;background:#0b3650}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:24px;max-width:900px;margin:auto}button{padding:22px;border:0;border-radius:18px;background:#147a6f;color:#fff;font-size:18px;cursor:pointer}button:hover{transform:scale(1.03);background:#1a9b8d}#card{max-width:800px;margin:10px auto 30px;padding:25px;background:#0d2a3d;border-radius:20px;min-height:130px}select{padding:10px;border-radius:10px}footer{padding:15px;color:#9ec4d4}</style></head><body><header><h1>🌍 Earth Information Jukebox</h1><p>Ask Earth, Hear Earth!</p></header><main><h2>Select a Topic</h2><div class='grid' id='topics'></div><div id='card'><h2>Welcome!</h2><p>Choose a topic to learn about our planet.</p></div><h2>🌡️ Earth Health Meter</h2><p id='meter'>🟡 Loading environmental awareness status...</p><button onclick='actionTips()'>♻️ What Can I Do?</button></main><footer>Hackathon Demo Project • Learn • Explore • Protect Earth</footer><script>const data={Weather:'Weather describes daily atmospheric conditions, while climate is the long-term pattern of weather.',Oceans:'Oceans cover most of Earth and help regulate climate while supporting enormous biodiversity.',Forests:'Forests provide habitats, store carbon, and support healthy ecosystems.',Pollution:'Pollution can harm air, water, soil, wildlife, and human communities.',Climate:'Climate change affects temperature patterns, ecosystems, and extreme weather risks.',Disasters:'Natural disasters include earthquakes, floods, storms, and volcanic events.'};const grid=document.getElementById('topics');Object.keys(data).forEach(k=>{let b=document.createElement('button');b.textContent=({'Weather':'🌦️','Oceans':'🌊','Forests':'🌳','Pollution':'♻️','Climate':'🌡️','Disasters':'🌋'}[k]||'🌍')+' '+k;b.onclick=()=>show(k);grid.appendChild(b)});function show(k){document.getElementById('card').innerHTML='<h2>'+k+'</h2><p>'+data[k]+'</p><button onclick="speak('+JSON.stringify(data[k])+')">🔊 Listen</button>'}function speak(t){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}function actionTips(){document.getElementById('card').innerHTML='<h2>♻️ What Can I Do?</h2><p>Save energy and water, reduce waste, reuse materials, avoid littering, and help spread environmental awareness.</p>';speak('You can save energy and water, reduce waste, reuse materials, avoid littering, and spread environmental awareness.')}setTimeout(()=>document.getElementById('meter').textContent='🟡 Awareness Mode: Our planet faces environmental challenges, and everyone can take positive action.',500)</script></body></html>
